name: Release Zapture Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-2025
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: main
        shell: pwsh
        run: '"sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT'
      - id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$') { throw 'version must be semantic versioning without a v prefix' }
          $tag = "zapture-desktop-v$env:VERSION"
          gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  macos:
    needs: prepare
    runs-on: macos-26
    environment: zapture-desktop-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test and typecheck
        run: bun run test && bun run typecheck
      - name: Install signing material
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/zapture-signing.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Generate macOS icon
        run: ./scripts/generate-macos-icon.sh
      - name: Package, sign, and notarize universal app
        env:
          DESKTOP_BUILD_VERSION: ${{ inputs.version }}
          DESKTOP_PRODUCTION: 'true'
          CSC_LINK: ${{ runner.temp }}/zapture-signing.p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run package:mac
      - name: Smoke test packaged app
        run: ./release/mac-universal/Zapture.app/Contents/MacOS/Zapture --ci-smoke
      - name: Prepare update metadata and checksums
        working-directory: release
        run: |
          sed -i '' -E 's#^([[:space:]]*- url: )#\1assets/#' latest-mac.yml
          shasum -a 256 *.dmg *.zip *.blockmap latest-mac.yml > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zapture-desktop-production-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    environment: zapture-desktop-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test and typecheck
        run: bun run test && bun run typecheck
      - name: Install signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: '[IO.File]::WriteAllBytes("$env:RUNNER_TEMP\zapture-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))'
      - name: Package and sign x64 installer
        env:
          DESKTOP_BUILD_VERSION: ${{ inputs.version }}
          DESKTOP_PRODUCTION: 'true'
          CSC_LINK: ${{ runner.temp }}\zapture-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun run package:win
      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\release\win-unpacked\Zapture.exe" -ArgumentList "--ci-smoke" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged Zapture exited with code $($process.ExitCode)" }
      - name: Prepare update metadata and checksums
        shell: pwsh
        working-directory: release
        run: |
          (Get-Content latest.yml) -replace '^(\s*-\surl:\s)', '$1assets/' | Set-Content latest.yml
          Get-ChildItem *.exe, *.blockmap, latest.yml | ForEach-Object { "$(Get-FileHash $_ -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zapture-desktop-production-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    needs: [prepare, macos, windows]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zapture-desktop-production-*
          path: release
          merge-multiple: true
      - name: Create and publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create $env:TAG --repo "${{ github.repository }}" --target $env:SHA --draft --title "Zapture Desktop ${{ inputs.version }}" --notes "Signed Zapture desktop release for macOS 13+ and Windows 10 22H2+."
          $files = @(Get-ChildItem release -File | Select-Object -ExpandProperty FullName)
          gh release upload $env:TAG $files --repo "${{ github.repository }}" --clobber
          gh release edit $env:TAG --repo "${{ github.repository }}" --draft=false
